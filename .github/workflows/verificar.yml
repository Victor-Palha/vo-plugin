name: Verificar

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Estrutura do plugin
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/verificar.py --base "origin/${{ github.base_ref }}"
          else
            python3 scripts/verificar.py
          fi

      - name: Hook de rastreio (Python 3.9, o do macOS)
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python scripts/testar_hook.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Manifestos (claude plugin validate)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate plugins/vo --strict
